# Render Blueprint for the WalkWhile API. In the Render dashboard choose
# New → Blueprint and pick this repo; it asks for DATABASE_URL (the Neon
# connection string) on the first deploy.
services:
  - type: web
    name: walkwhile-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
